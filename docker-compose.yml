name: crypto-zilla

x-kafka-image: &kafka-image apache/kafka:${KAFKA_VERSION:-4.3.0}
x-minio-image: &minio-image pgsty/minio:${MINIO_VERSION:-RELEASE.2026-03-25T00-00-00Z}
x-lakekeeper-image: &lakekeeper-image quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION:-v0.13.3}

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/lakekeeper
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?set in .env}
  RUST_LOG: info

x-spark: &spark
  build:
    context: .
    dockerfile: docker/spark.Dockerfile
  image: cryptozilla-spark:dev
  env_file: .env
  environment: &spark-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    CATALOG_URI: http://lakekeeper:8181/catalog
    SPARK_CHECKPOINT_ROOT: file:///opt/cz/checkpoints
  volumes:
    - spark-checkpoints:/opt/cz/checkpoints

services:
  kafka:
    image: *kafka-image
    container_name: cz-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: *kafka-image
    container_name: cz-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka:/opt/cz:ro
    entrypoint: ["/bin/sh", "/opt/cz/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:19092
      TOPICS_FILE: /opt/cz/topics.conf
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:${KAFKA_UI_VERSION:-v1.3.0}
    container_name: cz-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  ingest-binance:
    build:
      context: .
      dockerfile: docker/ingest.Dockerfile
    image: cryptozilla-ingest:dev
    container_name: cz-ingest-binance
    command: ["binance"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    restart: unless-stopped

  minio:
    image: *minio-image
    container_name: cz-minio
    hostname: minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: *minio-image
    container_name: cz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio:/opt/cz:ro
    entrypoint: ["/bin/sh", "/opt/cz/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-warehouse}
      CATALOG_S3_ACCESS_KEY: ${CATALOG_S3_ACCESS_KEY:?set in .env}
      CATALOG_S3_SECRET_KEY: ${CATALOG_S3_SECRET_KEY:?set in .env}
    restart: "no"

  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: cz-postgres
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lakekeeper
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 5s
      timeout: 5s
      retries: 12

  lakekeeper-migrate:
    image: *lakekeeper-image
    container_name: cz-lakekeeper-migrate
    command: ["migrate"]
    environment: *lakekeeper-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  lakekeeper:
    image: *lakekeeper-image
    container_name: cz-lakekeeper
    hostname: lakekeeper
    command: ["serve"]
    ports:
      - "8181:8181"
    environment: *lakekeeper-env
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  lakekeeper-init:
    image: curlimages/curl:${CURL_VERSION:-8.17.0}
    container_name: cz-lakekeeper-init
    depends_on:
      lakekeeper:
        condition: service_started
    volumes:
      - ./infra/lakekeeper:/opt/cz:ro
    entrypoint: ["/bin/sh", "/opt/cz/bootstrap.sh"]
    environment:
      CATALOG_WAREHOUSE: ${CATALOG_WAREHOUSE:-cz}
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-warehouse}
      CATALOG_S3_ACCESS_KEY: ${CATALOG_S3_ACCESS_KEY}
      CATALOG_S3_SECRET_KEY: ${CATALOG_S3_SECRET_KEY}
    restart: "no"

  spark-master:
    <<: *spark
    container_name: cz-spark-master
    hostname: spark-master
    command: ["spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8080:8080"
    volumes: []

  spark-worker:
    <<: *spark
    container_name: cz-spark-worker
    hostname: spark-worker
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES:-2}", "--memory", "${SPARK_WORKER_MEMORY:-2g}",
              "--webui-port", "8082", "--work-dir", "/opt/spark-work"]
    ports:
      - "8082:8082"
    depends_on:
      - spark-master

  spark-bronze:
    <<: *spark
    container_name: cz-spark-bronze
    hostname: spark-bronze
    command: ["cz-submit", "bronze_trades"]
    stop_grace_period: 60s
    ports:
      - "4040:4040"
    depends_on:
      spark-worker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      lakekeeper-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka-data:
  minio-data:
  postgres-data:
  spark-checkpoints: